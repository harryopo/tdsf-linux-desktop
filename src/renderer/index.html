<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <!-- 字符编码：UTF-8，支持中文 -->
    <meta charset="UTF-8" />
    <!-- 视口设置：适配不同屏幕尺寸 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 禁止右键菜单（Electron 桌面应用安全策略） -->
    <meta name="context-menu" content="no" />
    <!-- 页面标题 -->
    <title>TDSF-Linux Desktop</title>

    <!-- Web 字体引入（设计稿字体栈对齐）
         设计稿用 "SF Pro Text" / "SF Pro"（Apple 专有字体，Windows 无）
         策略：Inter 替代 SF Pro Text（视觉接近，开源免费）
              JetBrains Mono 作为代码字体（设计稿一致）
              中文 fallback 到 Microsoft YaHei（Windows 自带）
         加载方式：npm 包 @fontsource/inter + @fontsource/jetbrains-mono（本地化，离线可用）
         在 src/renderer/src/main.tsx 中 import 引入 -->
  </head>
  <body>
    <!-- React 根挂载点 -->
    <div id="root"></div>
    <!-- 引入 React 入口脚本（electron-vite 会处理打包） -->
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
