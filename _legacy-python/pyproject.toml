[project]
name = "tdsf-linux-desktop"
version = "0.1.0"
description = "TDSF-Linux Desktop - 面向Linux运维的人机协同可信决策桌面助手"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "TDSF Team" }]

dependencies = [
    "PySide6>=6.7.0",
    "paramiko>=3.4.0",
    "openai>=1.0.0",
    "pyte>=0.8.2",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "keyring>=24.0.0",
    "qdarktheme>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "nuitka>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tdsf_desktop"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

[tool.mypy]
python_version = "3.12"
strict = true
disable_error_code = ["override", "no-untyped-def", "type-arg", "no-any-return"]

[[tool.mypy.overrides]]
module = ["PySide6.*", "paramiko.*", "keyring.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tdsf_desktop.ssh.connection"
disable_error_code = ["override"]

[[tool.mypy.overrides]]
module = "tdsf_desktop.ui.terminal_widget"
disable_error_code = ["override", "call-overload"]
