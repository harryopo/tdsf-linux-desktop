name: Idea
description: 提交功能建议或改进想法
title: "[Idea] "
labels: ["enhancement", "discussion"]
body:
  - type: dropdown
    id: category
    attributes:
      label: 建议类型
      description: 这个想法属于哪一类？
      options:
        - 新功能
        - 现有功能改进
        - 性能优化
        - UI/UX 改进
        - 文档改进
        - 其他
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 痛点 / 场景
      description: 你在什么场景下遇到这个问题？现有方案有什么不足？
      placeholder: |
        示例：
        - 在 SSH 终端中执行长命令时，看不到 AI 实时分析
        - 教程词库的搜索结果按相关度排序不准
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 你的解决方案是什么？可以描述界面、交互、API 等
      placeholder: |
        示例：
        - 在终端右侧增加一个浮动面板，实时显示 AI 分析
        - 搜索时使用混合检索（BM25 + 向量）
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 是否有其他可能的实现方式？
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 截图、链接、参考项目等
  - type: checkboxes
    id: contrib
    attributes:
      label: 贡献意愿
      description: 你愿意自己实现这个功能吗？
      options:
        - label: 我愿意提交 PR
        - label: 我愿意测试 / 反馈
        - label: 我只提建议
