name: CI

on:
  push:
    branches: [master, feat/**, fix/**]
  pull_request:
    branches: [master]

# 取消上一次仍在运行的 CI（节省资源）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：这里每个 job 都只读仓库。build-win 那步把 GITHUB_TOKEN 交给 electron-builder，
# 只为从公开 release 下载 Electron 二进制；不写 permissions 时它会拿到仓库默认作用域（通常是写）。
permissions:
  contents: read

# 仓库根那份 .npmrc 是为国内开发机配的（registry 与 electron_mirror 都指向 npmmirror，
# 见文件里的实测教训）。但**CI 不该跟着本机的镜像走**：GitHub runner 在境外，
# 2026-10-20 那次 macos job 就是 `@electron/get` 从 npmmirror 取 mac 包失败，
# install 没报错、electron 二进制却缺位，于是 9 条要 import electron 的测试红在
# "Electron failed to install correctly"——那是环境红，不是产品红，而且换一次 runner 就可能不复现。
# @electron/get 优先读 ELECTRON_MIRROR 环境变量，这里把它钉回官方 release 源；
# registry 保持不动（lockfile 是按 registry 解析的，动它风险更大且与本问题无关）。
env:
  ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

jobs:
  # ===== Node 类型检查 =====
  typecheck-node:
    name: TypeScript (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (Node)
        run: pnpm typecheck:node

  # ===== Web 类型检查 =====
  typecheck-web:
    name: TypeScript (Web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (Web)
        run: pnpm typecheck:web

  # ===== Lint =====
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  # ===== tests/ 类型硬零闸（#107 清零后由它守着）=====
  typecheck-tests:
    name: TypeScript (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tsconfig.node/web 的 include 都不含 tests/，npm run lint 只扫 src，
      # 所以测试从来没有被类型检查过——2026-10-14 把存量 200 条按族削到 0，
      # 这一条就是让它不再长回来的执行体（CAP=0，注入一条必红）。
      - name: Type check (tests)
        run: pnpm types:tests

      # 门禁链自己（scripts 下的 .cjs/.mjs：密钥闸/拓扑闸/协作闸/设计闸/契约闸）不在
      # lint 与两个 tsconfig 的任何口径里。2026-10-14 给 tests-typecheck 加注释时，
      # 块注释里那段通配路径的"星号紧跟斜杠"提前关掉了注释、整个脚本变成语法错误——
      # 那天是我正好跑了它才发现；没人跑的那几天，它是安静地不说话的。
      - name: Syntax check (gate scripts)
        run: node scripts/quality/scripts-syntax-check.cjs

      # 目录卫生闸：拦「既没被跟踪、也没被忽略」的目录（Tailwind 按 git 可见文件取内容源，
      # 一次 git add -A 又能把整坨产物推进仓）。先跑阳性对照，证明这道闸真的有牙。
      - name: Scratch hygiene gate (self-test)
        run: node scripts/quality/scratch-hygiene-gate.cjs --self-test

      - name: Scratch hygiene gate
        run: pnpm hygiene:gate

  # ===== 单元测试 =====
  test:
    name: Vitest
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      # fetch-depth: 0 是必需的，不是保险：`tests/unit/history-env-scan.test.ts` 的两条
      # 阳性对照要在**全历史**里找被抹掉的凭据串。actions/checkout 默认只取 1 个提交，
      # 那时"历史里没有"会被闸如实报成"扫描器失效"⇒ 本地绿、CI 红。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test -- --reporter=verbose --coverage

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # ===== IPC 契约三方对账（防断链门禁） =====
  # 对账 main handler / preload 暴露 / 渲染层调用三方集合，
  # FAIL 级断链（invoke 无 handler / 调用未暴露方法）直接红。
  # 背景：typecheck/lint/单测查不出端到端接线断裂（假 UI/死按钮病灶）。
  audit-ipc:
    name: IPC Contract Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: IPC contract audit
        run: pnpm audit:ipc

  # ===== 渲染层 API 类型单源对账（P1-8） =====
  # electron.d.ts 已经 extends 由 preload 实现派生的类型，本体只剩"与实现不一致"的那批成员。
  # 这道闸用 TypeChecker 逐位比签名，判三件事不许复发：与实现完全同型的冗余声明、
  # 实现里根本没有的幻影成员（调到就是 undefined）、同名重复声明。
  # 另有一条 divergent 刻度（只许降）盯着剩下的真偏差。
  types-audit:
    name: Renderer Types Single Source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: electron.d.ts vs preload audit
        run: pnpm types:audit

  # ===== 设计契约三件套（DESIGN.md ↔ 令牌 ↔ 设置键）=====
  # 2026-10-15 全维度系统审查 E4：这三道本地都是绿的，但执行体是"有人手动跑了一下"。
  # 于是"字阶漂移了""设置键又接了个假的"这类结论只对上次跑它的人负责。搬进 CI 后每轮必跑。
  # 纯静态读文件，不需要构建产物，也不需要真窗口。
  design-gate:
    name: Design Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: DESIGN.md / tokens / settings-keys gate
        run: pnpm design:gate

  # ===== L0 契约生成物对账 =====
  # ipc-channels 的生成物若与契约不一致，preload/渲染层就会拿到 undefined（断链的第一类成因）。
  ipc-gen:
    name: IPC Contract Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generated contract is up to date
        run: pnpm ipc:check

  # ===== 死码/断链上限（unresolved / unlisted / files / duplicates / binaries）=====
  # 上限只许降；exports/types 两档故意不设上限（knip 看不见测试，本仓惯例是为单测才 export）。
  # 判据本身在 tests/unit/deadcode-gate.test.ts，全部离线可复算。
  deadcode-gate:
    name: Dead Code Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Knip ratchet gate
        run: pnpm deadcode:gate

  # ===== 文档断链 =====
  # 为什么单独一道：仓库公开前搬走过一批内部文档，当场量出 62 处链接指向已不存在的文件
  # （docs/INDEX.md 一份就 35 处）。这类断链不是写错，是"搬完没人回头对链接"——
  # 每次调整文档归属都会重演，而公开仓的首页指着 404 是门面事故。所以钉成闸，不靠下次记得。
  # 不需要装依赖：只读 git 跟踪集与磁盘上的 markdown。
  doc-links:
    name: Doc link integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 自检（量具自己是死的还是活的）
        run: node scripts/quality/doc-links.cjs --self-test

      - name: 扫全部已入库 markdown 的相对链接
        run: node scripts/quality/doc-links.cjs

  # ===== 身份与凭据的静态闸（零依赖脚本，不需要 pnpm install）=====
  # 为什么必须在 CI 里再来一遍：这几把原先只挂在 .git/hooks/pre-commit，
  # 而 hooks 不在版本控制里——新克隆的机器一把都不跑。本地闸只对这个工作副本负责，
  # 对"别人克隆出来改一版"没有任何约束力，那正是把约定当机制的错法。
  # 只放不依赖历史与本机的三把：security:history 要全历史（CI 是浅克隆），
  # promo:check 全量面要读仓库外那份宣传页——那两把留在本地，口径写进 CLAUDE.md。
  security-static:
    name: Identity & credential gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # --self-test 先拿每条规则自己的样例串验"这把尺子有牙"，验过了才继续扫跟踪集；
      # 所以一步就够——分成两步只会把 27 万行扫两遍。
      - name: 身份闸（阳性对照 + 扫跟踪集）
        run: node scripts/security/identity-gate.cjs --self-test

      - name: 凭据形态闸（扫跟踪集）
        run: node scripts/security/secret-gate.cjs --all

      - name: 架构图读数与仓库实测对账
        run: node scripts/quality/promo-readout.mjs --check-diagram

  # ===== 依赖漏洞（按公告号逐条认账）=====
  # 判据不是"漏洞总数上限"：公告库每天变，红的是没改代码的人，最后只会教人绕闸。
  # 这里只在"出现基线外的新 high/critical"时红；已知 42 条登记在 deps-audit-accepted.json，
  # 处置（升级/替换）归任务 #117，需人工批准。镜像站没有 audit 端点，脚本内已固定官方 registry。
  deps-audit:
    name: Dependency Advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Advisory gate
        run: pnpm audit:deps

  # ===== 端到端接线验证（真实 Electron + 行为断言） =====
  # 验证 preload 契约运行时可达 / Agent 事件回流 / 发送按钮有反馈 / 假 UI 不复活。
  # Windows runner 可直接跑有头 Electron，无需 xvfb。
  e2e-wiring:
    name: E2E Wiring (Electron)
    runs-on: windows-latest
    needs: [typecheck-node, typecheck-web, lint]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check native modules load from prebuilds
        # 这一步原先是 `npx @electron/rebuild -f --only better-sqlite3`，从立起那天就一直红：
        # 它实际用的是项目里的 node-gyp@9，认不出 runner 镜像上的新版 VS
        # （"Could not find any Visual Studio installation to use"）。
        # 查下来根本不需要重编：better-sqlite3 v13 与 node-pty 1.1 都发 N-API 预编译，
        # 同一颗 .node 在 Node 与 Electron 里都能加载（本机 e2e 就是走这条路过的）。
        # 换成一条能失败的断言——哪天上游不发 prebuild 了，这里当场红并说明要恢复重编。
        run: node scripts/quality/check-native-prebuild.cjs

      - name: Build app
        run: pnpm build

      - name: Run wiring verification E2E
        run: pnpm test:e2e:wiring

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-wiring
          path: playwright-report/
          retention-days: 7

  # ===== Build (Windows) =====
  build-win:
    name: Build (Windows)
    runs-on: windows-latest
    needs: [typecheck-node, typecheck-web, lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows installer
        run: pnpm build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: tdsf-linux-desktop-windows
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 14
