name: CI

on:
  push:
    branches: [master, feat/**, fix/**]
  pull_request:
    branches: [master]

# 取消上一次仍在运行的 CI（节省资源）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===== Node 类型检查 =====
  typecheck-node:
    name: TypeScript (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (Node)
        run: pnpm typecheck:node

  # ===== Web 类型检查 =====
  typecheck-web:
    name: TypeScript (Web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (Web)
        run: pnpm typecheck:web

  # ===== Lint =====
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  # ===== 单元测试 =====
  test:
    name: Vitest
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test -- --reporter=verbose --coverage

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # ===== IPC 契约三方对账（防断链门禁） =====
  # 对账 main handler / preload 暴露 / 渲染层调用三方集合，
  # FAIL 级断链（invoke 无 handler / 调用未暴露方法）直接红。
  # 背景：typecheck/lint/单测查不出端到端接线断裂（假 UI/死按钮病灶）。
  audit-ipc:
    name: IPC Contract Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: IPC contract audit
        run: pnpm audit:ipc

  # ===== 端到端接线验证（真实 Electron + 行为断言） =====
  # 验证 preload 契约运行时可达 / Agent 事件回流 / 发送按钮有反馈 / 假 UI 不复活。
  # Windows runner 可直接跑有头 Electron，无需 xvfb。
  e2e-wiring:
    name: E2E Wiring (Electron)
    runs-on: windows-latest
    needs: [typecheck-node, typecheck-web, lint]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild native modules for Electron
        run: pnpm rebuild

      - name: Build app
        run: pnpm build

      - name: Run wiring verification E2E
        run: pnpm test:e2e:wiring

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-wiring
          path: playwright-report/
          retention-days: 7

  # ===== Build (Windows) =====
  build-win:
    name: Build (Windows)
    runs-on: windows-latest
    needs: [typecheck-node, typecheck-web, lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows installer
        run: pnpm build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: tdsf-linux-desktop-windows
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 14
