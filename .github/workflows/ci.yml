name: CI

on:
  push:
    branches: [master, feat/**, fix/**]
  pull_request:
    branches: [master]

# 取消上一次仍在运行的 CI（节省资源）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：这里每个 job 都只读仓库。build-win 那步把 GITHUB_TOKEN 交给 electron-builder，
# 只为从公开 release 下载 Electron 二进制；不写 permissions 时它会拿到仓库默认作用域（通常是写）。
permissions:
  contents: read

jobs:
  # ===== Node 类型检查 =====
  typecheck-node:
    name: TypeScript (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (Node)
        run: pnpm typecheck:node

  # ===== Web 类型检查 =====
  typecheck-web:
    name: TypeScript (Web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (Web)
        run: pnpm typecheck:web

  # ===== Lint =====
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  # ===== 单元测试 =====
  test:
    name: Vitest
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test -- --reporter=verbose --coverage

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # ===== IPC 契约三方对账（防断链门禁） =====
  # 对账 main handler / preload 暴露 / 渲染层调用三方集合，
  # FAIL 级断链（invoke 无 handler / 调用未暴露方法）直接红。
  # 背景：typecheck/lint/单测查不出端到端接线断裂（假 UI/死按钮病灶）。
  audit-ipc:
    name: IPC Contract Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: IPC contract audit
        run: pnpm audit:ipc

  # ===== 渲染层 API 类型单源对账（P1-8） =====
  # electron.d.ts 已经 extends 由 preload 实现派生的类型，本体只剩"与实现不一致"的那批成员。
  # 这道闸用 TypeChecker 逐位比签名，判三件事不许复发：与实现完全同型的冗余声明、
  # 实现里根本没有的幻影成员（调到就是 undefined）、同名重复声明。
  # 另有一条 divergent 刻度（只许降）盯着剩下的真偏差。
  types-audit:
    name: Renderer Types Single Source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: electron.d.ts vs preload audit
        run: pnpm types:audit

  # ===== 端到端接线验证（真实 Electron + 行为断言） =====
  # 验证 preload 契约运行时可达 / Agent 事件回流 / 发送按钮有反馈 / 假 UI 不复活。
  # Windows runner 可直接跑有头 Electron，无需 xvfb。
  e2e-wiring:
    name: E2E Wiring (Electron)
    runs-on: windows-latest
    needs: [typecheck-node, typecheck-web, lint]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild native modules for Electron
        # 只重编 better-sqlite3：ssh2 可选依赖 cpu-features 缺 VS 会红，无原生加速时 ssh2 自动回退纯 JS。
        # 项目内 electron-rebuild@3.6 捆绑 node-gyp@9 无法识别 runner 上的新版 VS，
        # 改用最新 @electron/rebuild（捆绑 node-gyp@11）；-w 不限制依赖树，必须用 --only。
        run: npx --yes @electron/rebuild@4 -f --only better-sqlite3

      - name: Build app
        run: pnpm build

      - name: Run wiring verification E2E
        run: pnpm test:e2e:wiring

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-wiring
          path: playwright-report/
          retention-days: 7

  # ===== Build (Windows) =====
  build-win:
    name: Build (Windows)
    runs-on: windows-latest
    needs: [typecheck-node, typecheck-web, lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows installer
        run: pnpm build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: tdsf-linux-desktop-windows
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 14
