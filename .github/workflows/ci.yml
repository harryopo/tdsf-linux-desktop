name: CI

on:
  push:
    branches: [master, feat/**, fix/**]
  pull_request:
    branches: [master]

# 取消上一次仍在运行的 CI（节省资源）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：这里每个 job 都只读仓库。build-win 那步把 GITHUB_TOKEN 交给 electron-builder，
# 只为从公开 release 下载 Electron 二进制；不写 permissions 时它会拿到仓库默认作用域（通常是写）。
permissions:
  contents: read

jobs:
  # ===== Node 类型检查 =====
  typecheck-node:
    name: TypeScript (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (Node)
        run: pnpm typecheck:node

  # ===== Web 类型检查 =====
  typecheck-web:
    name: TypeScript (Web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (Web)
        run: pnpm typecheck:web

  # ===== Lint =====
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  # ===== tests/ 类型硬零闸（#107 清零后由它守着）=====
  typecheck-tests:
    name: TypeScript (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tsconfig.node/web 的 include 都不含 tests/，npm run lint 只扫 src，
      # 所以测试从来没有被类型检查过——2026-10-14 把存量 200 条按族削到 0，
      # 这一条就是让它不再长回来的执行体（CAP=0，注入一条必红）。
      - name: Type check (tests)
        run: pnpm types:tests

      # 门禁链自己（scripts 下的 .cjs/.mjs：密钥闸/拓扑闸/协作闸/设计闸/契约闸）不在
      # lint 与两个 tsconfig 的任何口径里。2026-10-14 给 tests-typecheck 加注释时，
      # 块注释里那段通配路径的"星号紧跟斜杠"提前关掉了注释、整个脚本变成语法错误——
      # 那天是我正好跑了它才发现；没人跑的那几天，它是安静地不说话的。
      - name: Syntax check (gate scripts)
        run: node scripts/quality/scripts-syntax-check.cjs

  # ===== 单元测试 =====
  test:
    name: Vitest
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test -- --reporter=verbose --coverage

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # ===== IPC 契约三方对账（防断链门禁） =====
  # 对账 main handler / preload 暴露 / 渲染层调用三方集合，
  # FAIL 级断链（invoke 无 handler / 调用未暴露方法）直接红。
  # 背景：typecheck/lint/单测查不出端到端接线断裂（假 UI/死按钮病灶）。
  audit-ipc:
    name: IPC Contract Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: IPC contract audit
        run: pnpm audit:ipc

  # ===== 渲染层 API 类型单源对账（P1-8） =====
  # electron.d.ts 已经 extends 由 preload 实现派生的类型，本体只剩"与实现不一致"的那批成员。
  # 这道闸用 TypeChecker 逐位比签名，判三件事不许复发：与实现完全同型的冗余声明、
  # 实现里根本没有的幻影成员（调到就是 undefined）、同名重复声明。
  # 另有一条 divergent 刻度（只许降）盯着剩下的真偏差。
  types-audit:
    name: Renderer Types Single Source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: electron.d.ts vs preload audit
        run: pnpm types:audit

  # ===== 设计契约三件套（DESIGN.md ↔ 令牌 ↔ 设置键）=====
  # 2026-10-15 全维度系统审查 E4：这三道本地都是绿的，但执行体是"有人手动跑了一下"。
  # 于是"字阶漂移了""设置键又接了个假的"这类结论只对上次跑它的人负责。搬进 CI 后每轮必跑。
  # 纯静态读文件，不需要构建产物，也不需要真窗口。
  design-gate:
    name: Design Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: DESIGN.md / tokens / settings-keys gate
        run: pnpm design:gate

  # ===== L0 契约生成物对账 =====
  # ipc-channels 的生成物若与契约不一致，preload/渲染层就会拿到 undefined（断链的第一类成因）。
  ipc-gen:
    name: IPC Contract Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generated contract is up to date
        run: pnpm ipc:check

  # ===== 死码/断链上限（unresolved / unlisted / files / duplicates / binaries）=====
  # 上限只许降；exports/types 两档故意不设上限（knip 看不见测试，本仓惯例是为单测才 export）。
  # 判据本身在 tests/unit/deadcode-gate.test.ts，全部离线可复算。
  deadcode-gate:
    name: Dead Code Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Knip ratchet gate
        run: pnpm deadcode:gate

  # ===== 文档断链 =====
  # 为什么单独一道：仓库公开前搬走过一批内部文档，当场量出 62 处链接指向已不存在的文件
  # （docs/INDEX.md 一份就 35 处）。这类断链不是写错，是"搬完没人回头对链接"——
  # 每次调整文档归属都会重演，而公开仓的首页指着 404 是门面事故。所以钉成闸，不靠下次记得。
  # 不需要装依赖：只读 git 跟踪集与磁盘上的 markdown。
  doc-links:
    name: Doc link integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 自检（量具自己是死的还是活的）
        run: node scripts/quality/doc-links.cjs --self-test

      - name: 扫全部已入库 markdown 的相对链接
        run: node scripts/quality/doc-links.cjs

  # ===== 依赖漏洞（按公告号逐条认账）=====
  # 判据不是"漏洞总数上限"：公告库每天变，红的是没改代码的人，最后只会教人绕闸。
  # 这里只在"出现基线外的新 high/critical"时红；已知 42 条登记在 deps-audit-accepted.json，
  # 处置（升级/替换）归任务 #117，需人工批准。镜像站没有 audit 端点，脚本内已固定官方 registry。
  deps-audit:
    name: Dependency Advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Advisory gate
        run: pnpm audit:deps

  # ===== 端到端接线验证（真实 Electron + 行为断言） =====
  # 验证 preload 契约运行时可达 / Agent 事件回流 / 发送按钮有反馈 / 假 UI 不复活。
  # Windows runner 可直接跑有头 Electron，无需 xvfb。
  e2e-wiring:
    name: E2E Wiring (Electron)
    runs-on: windows-latest
    needs: [typecheck-node, typecheck-web, lint]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild native modules for Electron
        # 只重编 better-sqlite3：ssh2 可选依赖 cpu-features 缺 VS 会红，无原生加速时 ssh2 自动回退纯 JS。
        # 项目内 electron-rebuild@3.6 捆绑 node-gyp@9 无法识别 runner 上的新版 VS，
        # 改用最新 @electron/rebuild（捆绑 node-gyp@11）；-w 不限制依赖树，必须用 --only。
        run: npx --yes @electron/rebuild@4 -f --only better-sqlite3

      - name: Build app
        run: pnpm build

      - name: Run wiring verification E2E
        run: pnpm test:e2e:wiring

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-wiring
          path: playwright-report/
          retention-days: 7

  # ===== Build (Windows) =====
  build-win:
    name: Build (Windows)
    runs-on: windows-latest
    needs: [typecheck-node, typecheck-web, lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows installer
        run: pnpm build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: tdsf-linux-desktop-windows
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 14
