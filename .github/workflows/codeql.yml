# CodeQL — GitHub 原生安全分析
#
# 开源协作基线：
# - 自动扫描 TypeScript / JavaScript 代码安全漏洞
# - 每周一扫描 + PR 触发
# - 与安全策略联动（详见 SECURITY.md）

name: "CodeQL"

on:
  push:
    branches: [master, feat/**, fix/**]
  pull_request:
    branches: [master]
  schedule:
    # GitHub 的 cron 必须是 5 个字段（分 时 日 月 周）。
    # 0 22 * * 0 = 每周日 22:00 UTC = 北京时间每周一 06:00（错开 Dependabot 的 04:00）。
    #
    # 为什么 2026-07-25 建立后 100 次运行 0 次成功（每次推送都生成一个「0 个 job、直接 failure」的 run）：
    # 失败 run 的页面 HTML 里写着原话 "(Line: 66, Col: 13): A sequence was not expected"——
    # init 的 `with.paths-ignore` 被写成了 YAML 列表，而 `with` 的值只能是标量，整个 workflow 在解析期就被拒。
    # 改 cron 治不了它（这也是之前"修好了"的判断错在哪）。
    # 同时 matrix 里的 `typescript` 不是合法的 CodeQL 语言（JavaScript + TypeScript 由
    # `javascript-typescript` 一个分析器覆盖），解析修好后它也会让作业失败。两处一起改。
    #
    # 第一次跑通后还有两个平台提示（2026-10-20 实测）：
    # ① `with.paths-ignore` 根本不是 init 的合法入参（只得到一条 warning，规则不生效），
    #    排除面改用 .github/codeql/codeql-config.yml 里的 paths/paths-ignore；
    # ② codeql-action v3 将在 2026-12 弃用，改用 v4。
    - cron: "0 22 * * 0"

# 同 ci.yml 的并发控制
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # JavaScript + TypeScript 共用一个分析器；`typescript` 不是合法语言名
        language: ["javascript-typescript"]
        # 排除 sidecar-a 的 Python（暂未启用 Python 分析）
        # 排除 docs/ 和 tests/ 下的 demo 代码

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # 安全信号优先：security-extended 比默认多查安全类规则，但不带 quality 噪声
          queries: security-extended
          # 分析面（只扫 src）在配置文件里，`with` 不接受 paths-ignore
          config-file: .github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
