# CodeQL — GitHub 原生安全分析
#
# 开源协作基线：
# - 自动扫描 TypeScript / JavaScript 代码安全漏洞
# - 每周一扫描 + PR 触发
# - 与安全策略联动（详见 SECURITY.md）

name: "CodeQL"

on:
  push:
    branches: [master, feat/**, fix/**]
  pull_request:
    branches: [master]
  schedule:
    # GitHub 的 cron 必须是 5 个字段（分 时 日 月 周）。
    # 原来这里写的是 "22:00 SUN"——不是合法 cron，整个 workflow 在解析阶段就被拒，
    # 于是每次 push 都生成一个「0 个 job、直接 failure」的 run 并给仓库所有者发一封失败邮件，
    # 而 CodeQL 一次也没真跑过（实测 API：/code-scanning/alerts 返回 404 no analysis found）。
    # 0 22 * * 0 = 每周日 22:00 UTC = 北京时间每周一 06:00（错开 Dependabot 的 04:00）
    - cron: "0 22 * * 0"

# 同 ci.yml 的并发控制
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["typescript", "javascript"]
        # 排除 sidecar-a 的 Python（暂未启用 Python 分析）
        # 排除 docs/ 和 tests/ 下的 demo 代码

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # 不使用默认 queries，使用 security-and-quality 套件
          queries: security-and-quality
          # 排除不需要扫描的路径
          paths-ignore:
            - docs/**
            - tests/**
            - "**/*.test.ts"
            - "**/*.test.tsx"
            - "**/*.spec.ts"
            - "**/*.spec.tsx"
            - "**/__tests__/**"
            - "_legacy-python/**"
            - "scripts/**"
            - "sidecar-a/**"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
