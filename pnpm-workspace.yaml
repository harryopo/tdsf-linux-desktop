allowBuilds:
  better-sqlite3: true
  cpu-features: true
  electron: true
  esbuild: true
  protobufjs: true
  sharp: true
  ssh2: true
  tree-sitter-bash: true
minimumReleaseAgeExclude:
  - better-sqlite3@13.0.1
onlyBuiltDependencies:
  - better-sqlite3
  - ssh2
  - cpu-features
  - electron
  - esbuild
  - protobufjs
  - sharp
  - tree-sitter-bash
overrides:
  # react-arborist 锁着 use-sync-external-store@1.2.0，其 peer 只到 react 18；
  # 1.7.0 的 peer 才含 ^19，升 React 19 后不强制会一直报 unmet peer。
  use-sync-external-store: ^1.7.0
