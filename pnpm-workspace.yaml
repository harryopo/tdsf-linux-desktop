allowBuilds:
  better-sqlite3: true
  cpu-features: true
  electron: true
  electron-winstaller: false
  esbuild: true
  # 本机终端的 PTY 是原生模块：install 脚本先取预编译产物，取不到才 node-gyp 现编。
  # 不放开这个开关，pnpm 会静默跳过构建，运行时才报找不到 pty.node。
  node-pty: true
  protobufjs: true
  sharp: true
  ssh2: true
  tree-sitter-bash: true
minimumReleaseAgeExclude:
  - better-sqlite3@13.0.1
onlyBuiltDependencies:
  - better-sqlite3
  - ssh2
  - cpu-features
  - electron
  - esbuild
  - node-pty
  - protobufjs
  - sharp
  - tree-sitter-bash
overrides:
  # react-arborist 锁着 use-sync-external-store@1.2.0，其 peer 只到 react 18；
  # 1.7.0 的 peer 才含 ^19，升 React 19 后不强制会一直报 unmet peer。
  use-sync-external-store: ^1.7.0
  # electron-builder 26 的代码用了 @electron/get 的 ElectronDownloadCacheMode（v5 才有），
  # 它自己只声明 ^3.0.0；pnpm 的隔离布局严格按声明解析，于是任何"下载构建工具集"的路径
  # 都在 resolveCacheMode 里抛 "Cannot read properties of undefined (reading 'ReadWrite')"。
  # npm 的扁平布局会侥幸命中 hoisted 的 v5，所以这个坑只在 pnpm 下出现。
  # 只作用于 app-builder-lib，不动 electron 自身的 @electron/get（否则 electron 会重装二进制）。
  'app-builder-lib>@electron/get': ^5.0.0
  # 下面这批是传递依赖的安全补丁钉版（2026-10-12，由 pnpm audit 的 findings.paths 生成）。
  # 每条都要求「与当前装的同一主版本、0.x 还要求同小版本」，跨大版本的补丁一律不钉 ——
  # 父包按自己的范围用包，强扭会拿功能换分数。
  # pnpm 自己给的提示：这几个不改 override 就只会停在旧版（manifest 里别处也要求同一包）。
  # 第二轮：这些是第一批钉完之后 audit 又报出来的同族补丁（同主版本、已发布）。
  # braces@3.0.4 与 sprintf-js@1.1.4 官方还没发版（npm 上分别只到 3.0.3 / 1.1.3）。
  # braces 这条链已在 2026-10-22 随 @typescript-eslint v8 升级消失，不需要钉了；sprintf-js 仍无修复版。
  # sharp 三条 high 全在图片解码栈（libvips/libheif/librsvg），修复只在 0.35.x；0.32 这条线没有补丁版。
  # 本应用只跑文本向量（feature-extraction），sharp 走不到；但它是 @xenova/transformers 的硬依赖，
  # utils/image.js 顶层 static import，删不掉，所以跟着升到 0.35.5。判据：模型仍能解出 512 维向量。
  "@xenova/transformers>sharp": "0.35.5"
  # 2026-10-23：dompurify 三条公告（critical GHSA-cg2g-xh64-v4q7 / high GHSA-mrv2-3pqr-j5jr /
  # low GHSA-c6gr-qvv4-5v3f）受影响区间到 3.4.16 为止，3.4.17 是区间外第一个版本；
  # ip-address 的 GHSA-rxp7-6hxx-x8q5 到 10.7.3 为止，修补版 10.7.4。同主版本同小版本，按规矩钉。
  "monaco-editor>dompurify": "3.4.17"
  "@ai-sdk/provider-utils>nanoid": "3.3.18"
  "@babel/helper-compilation-targets>browserslist": "4.28.7"
  "@electron/get>undici": "7.29.1"
  "@eslint/eslintrc>js-yaml": "4.3.2"
  # GHSA-5r4p-p66f-jhc7：4.13.7 落在 >=4.12.4 <4.13.11 的受影响区间；MCP SDK 的
  # HTTP 传输链带着它。两个父包各自声明，必须分别钉（只写 hono 不会覆盖嵌套解析）。
  "@hono/node-server>hono": "4.13.13"
  "@modelcontextprotocol/sdk>@hono/node-server": "1.19.15"
  "@modelcontextprotocol/sdk>hono": "4.13.13"
  "@tailwindcss/node>source-map-js": "1.2.2"
  "@tailwindcss/postcss>postcss": "8.5.23"
  "ajv>fast-uri": "3.1.8"
  "app-builder-lib>ejs": "3.1.10"
  "app-builder-lib>js-yaml": "4.3.2"
  "body-parser>qs": "6.16.0"
  "browserslist>baseline-browser-mapping": "2.11.0"
  "builder-util>js-yaml": "4.3.2"
  "cacheable-request>http-cache-semantics": "4.3.0"
  "cheerio>undici": "7.29.1"
  "dmg-builder>js-yaml": "4.3.2"
  "express-rate-limit>ip-address": "10.7.4"
  "express>proxy-addr": "2.0.8"
  "express>qs": "6.16.0"
  "gray-matter>js-yaml": "3.15.2"
  "knip>smol-toml": "1.9.0"
  "magicast>source-map-js": "1.2.2"
  "make-fetch-happen>http-cache-semantics": "4.3.0"
  # 同一父包下并存多个大版本的子包，必须把子包大版本写进键里：
  # 只写 minimatch>brace-expansion 会把 v5 的 API 塞给 minimatch@3（它要 ^1），
  # 实测后果是 eslint 直接崩在 Minimatch.braceExpand（expand is not a function）。
  # protobufjs 6.x 没有修复版：critical 那条（任意代码执行）只在 7.x 修。这条是跨主版本钉版，
  # 判据不是"装上了"而是"模型还解得开"——onnxruntime-web 解析本地缓存的 ONNX 模型跑出 512 维向量才算过。
  "protobufjs@<7.6.6": "7.6.6"
  "minimatch>brace-expansion@1": "1.1.21"
  "minimatch>brace-expansion@2": "2.1.7"
  "minimatch>brace-expansion@5": "5.0.12"
  "openai>qs": "6.16.0"
  "plist>@xmldom/xmldom": "0.9.12"
  "postcss>nanoid": "3.3.18"
  "postcss>source-map-js": "1.2.2"
  "rc>ini": "1.3.6"
  "socks>ip-address": "10.7.4"
  "tiny-async-pool>semver": "5.7.2"
  "vite>postcss": "8.5.23"
