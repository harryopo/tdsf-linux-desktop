allowBuilds:
  better-sqlite3: true
  cpu-features: true
  electron: true
  electron-winstaller: false
  esbuild: true
  # 本机终端的 PTY 是原生模块：install 脚本先取预编译产物，取不到才 node-gyp 现编。
  # 不放开这个开关，pnpm 会静默跳过构建，运行时才报找不到 pty.node。
  node-pty: true
  protobufjs: true
  sharp: true
  ssh2: true
  tree-sitter-bash: true
minimumReleaseAgeExclude:
  - better-sqlite3@13.0.1
onlyBuiltDependencies:
  - better-sqlite3
  - ssh2
  - cpu-features
  - electron
  - esbuild
  - node-pty
  - protobufjs
  - sharp
  - tree-sitter-bash
overrides:
  # react-arborist 锁着 use-sync-external-store@1.2.0，其 peer 只到 react 18；
  # 1.7.0 的 peer 才含 ^19，升 React 19 后不强制会一直报 unmet peer。
  use-sync-external-store: ^1.7.0
  # electron-builder 26 的代码用了 @electron/get 的 ElectronDownloadCacheMode（v5 才有），
  # 它自己只声明 ^3.0.0；pnpm 的隔离布局严格按声明解析，于是任何"下载构建工具集"的路径
  # 都在 resolveCacheMode 里抛 "Cannot read properties of undefined (reading 'ReadWrite')"。
  # npm 的扁平布局会侥幸命中 hoisted 的 v5，所以这个坑只在 pnpm 下出现。
  # 只作用于 app-builder-lib，不动 electron 自身的 @electron/get（否则 electron 会重装二进制）。
  'app-builder-lib>@electron/get': ^5.0.0
