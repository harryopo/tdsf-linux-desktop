[PROFILING]
enabled = false
report_sec = 60

[SNAPSHOT]
snapshot_interval_minutes = 1
compress_state = true

[DRAIN]
extra_delimiters = []
sim_th = 0.5
depth = 4
max_children = 100
max_clusters = 1024
parametrize_numeric_tokens = true

[MASKING]
masking = []
mask_prefix = <
mask_suffix = >
parameter_extraction_cache_capacity = 3000
